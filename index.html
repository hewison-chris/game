<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chuckie Lift — Retro Elm Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background: radial-gradient(circle at 50% 35%, #111b36 0%, #060914 68%, #03050a 100%);
      color: #f1f5f9;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      padding: 14px;
    }
    .arcade-cabinet {
      width: 100%;
      max-width: 980px;
      background: linear-gradient(160deg, #161f38 0%, #0b1020 55%, #070a14 100%);
      border: 2px solid #1e293b;
      border-radius: 16px;
      padding: 14px 16px 12px;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.75),
        0 0 42px rgba(45, 212, 191, 0.16),
        inset 0 1px 0 rgba(148, 163, 184, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .cabinet-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #64748b;
      text-transform: uppercase;
    }
    .cabinet-title {
      color: #2dd4bf;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(45, 212, 191, 0.45);
    }
    .cabinet-leds {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .led.teal {
      background: #2dd4bf;
      box-shadow: 0 0 8px #2dd4bf;
    }
    .led.pink {
      background: #f472b6;
      box-shadow: 0 0 8px #f472b6;
    }
    .led.gold {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
    }
    #elm-root {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-shell {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    svg {
      width: 100%;
      height: auto;
      max-height: 82vh;
      border: 2px solid #2dd4bf;
      border-radius: 8px;
      box-shadow:
        0 0 28px rgba(45, 212, 191, 0.22),
        inset 0 0 18px rgba(0, 0, 0, 0.65);
      background: #070b18;
      display: block;
    }
    .cabinet-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #475569;
    }
    .cabinet-footer span strong {
      color: #94a3b8;
    }

    /* Mobile / Touch Controls */
    .touch-controls {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 6px 8px 2px;
      gap: 10px;
      touch-action: none;
    }
    .thumb-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      touch-action: none;
    }
    .dpad {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 5px;
      padding: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.85) 0%, rgba(9, 14, 29, 0.95) 100%);
      border: 2px solid #24324a;
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.7), 0 0 14px rgba(45, 212, 191, 0.12);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-nub {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #334155 0%, #0f172a 75%);
      border: 2px solid #475569;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      z-index: 2;
      opacity: 0.78;
    }
    .dpad-nub.active {
      background: radial-gradient(circle at 35% 30%, #5eead4 0%, #0d9488 65%, #115e59 100%);
      border-color: #ccfbf1;
      box-shadow: 0 0 18px rgba(45, 212, 191, 0.65);
      opacity: 0.95;
    }
    .dpad-center {
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 75%);
      border: 1px solid #334155;
      margin: 8px;
      pointer-events: none;
    }
    .dpad-corner {
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.25);
      border: 1px dashed rgba(71, 85, 105, 0.35);
      margin: 12px;
      pointer-events: none;
      transition: background 0.08s ease, border-color 0.08s ease;
    }
    .dpad-corner.active {
      background: rgba(45, 212, 191, 0.45);
      border-color: #2dd4bf;
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
    }
    .ctrl-btn {
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
      font-size: 20px;
      color: #e2e8f0;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 4px 0 #020617, 0 0 12px rgba(45, 212, 191, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad .ctrl-btn {
      pointer-events: none;
    }
    .ctrl-btn.active,
    .ctrl-btn:active {
      background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%);
      border-color: #2dd4bf;
      color: #ffffff;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #020617, 0 0 18px rgba(45, 212, 191, 0.45);
    }
    .meta-controls {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    .meta-btn {
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1px;
      color: #cbd5e1;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 999px;
      padding: 7px 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .meta-btn:active {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .action-controls {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .jump-btn {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      font-size: 15px;
      letter-spacing: 1px;
      color: #070b18;
      background: radial-gradient(circle at 35% 30%, #fde047 0%, #f59e0b 65%, #b45309 100%);
      border: 3px solid #fef08a;
      box-shadow: 0 5px 0 #78350f, 0 0 22px rgba(250, 204, 21, 0.35);
    }
    .jump-btn.active,
    .jump-btn:active {
      background: radial-gradient(circle at 35% 30%, #fef9c3 0%, #facc15 65%, #d97706 100%);
      border-color: #ffffff;
      color: #070b18;
      transform: translateY(3px);
      box-shadow: 0 2px 0 #78350f, 0 0 28px rgba(250, 204, 21, 0.65);
    }

    .mode-toggle {
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #2dd4bf;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #2dd4bf;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .mode-toggle:active {
      background: #0f766e;
      color: #ffffff;
    }

    body.mobile-mode {
      padding: 6px;
      justify-content: flex-start;
    }
    body.mobile-mode .arcade-cabinet {
      padding: 8px 8px 10px;
      border-radius: 12px;
      gap: 6px;
      max-height: 100dvh;
    }
    body.mobile-mode .cabinet-header {
      font-size: 10px;
      letter-spacing: 1px;
    }
    body.mobile-mode .cabinet-footer {
      display: none;
    }
    body.mobile-mode svg {
      max-height: 56dvh;
    }
    body.mobile-mode .touch-controls {
      display: flex;
    }

    @media (max-height: 500px) and (orientation: landscape) {
      body.mobile-mode .cabinet-leds,
      body.mobile-mode .cabinet-title {
        display: none;
      }
      body.mobile-mode .cabinet-header {
        justify-content: flex-end;
        padding: 0;
      }
      body.mobile-mode .game-shell {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      body.mobile-mode svg {
        max-height: 84dvh;
        width: auto;
        max-width: 68vw;
      }
      body.mobile-mode .touch-controls {
        width: auto;
        flex-direction: column;
        justify-content: space-between;
        height: 82dvh;
        padding: 4px;
      }
      body.mobile-mode .thumb-row {
        flex-direction: column;
        gap: 10px;
      }
      body.mobile-mode .dpad {
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 44px);
        gap: 4px;
      }
      body.mobile-mode .jump-btn {
        width: 68px;
        height: 68px;
        font-size: 13px;
      }
      body.mobile-mode .meta-controls {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <div class="arcade-cabinet">
    <div class="cabinet-header">
      <div class="cabinet-leds">
        <span class="led teal"></span>
        <span class="led pink"></span>
        <span class="led gold"></span>
      </div>
      <div class="cabinet-title">CHUCKIE LIFT // ARCADE EDITION</div>
      <button id="mode-toggle" class="mode-toggle" type="button">MOBILE CONTROLS</button>
    </div>
    <div id="elm-root"></div>
    <div class="cabinet-footer">
      <span><strong>MOVE:</strong> ARROWS / WASD</span>
      <span><strong>JUMP:</strong> SPACE</span>
      <span><strong>PAUSE:</strong> P</span>
      <span><strong>RESTART:</strong> R</span>
    </div>
  </div>
  <script src="main.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = "chuckie-lift-mobile-mode";
      var btn = document.getElementById("mode-toggle");

      function detectMobile() {
        return (
          window.matchMedia("(pointer: coarse)").matches ||
          "ontouchstart" in window ||
          navigator.maxTouchPoints > 0 ||
          window.innerWidth <= 900
        );
      }

      function applyMode(isMobile) {
        document.body.classList.toggle("mobile-mode", isMobile);
        btn.textContent = isMobile ? "SWITCH TO DESKTOP MODE" : "SWITCH TO MOBILE MODE";
      }

      var saved = null;
      try {
        saved = localStorage.getItem(STORAGE_KEY);
      } catch (e) {}

      var isMobile = saved !== null ? saved === "1" : detectMobile();
      applyMode(isMobile);

      btn.addEventListener("click", function () {
        isMobile = !document.body.classList.contains("mobile-mode");
        applyMode(isMobile);
        try {
          localStorage.setItem(STORAGE_KEY, isMobile ? "1" : "0");
        } catch (e) {}
      });
    })();

    window.addEventListener("keydown", function (e) {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);
    var app = Elm.Main.init({
      node: document.getElementById("elm-root")
    });

    (function () {
      var activeTouchId = null;
      var mouseDown = false;
      var lastState = { axisX: 0, axisY: 0 };

      function sendDpad(state) {
        if (
          Math.abs(state.axisX - lastState.axisX) > 0.015 ||
          Math.abs(state.axisY - lastState.axisY) > 0.015 ||
          (state.axisX === 0 && lastState.axisX !== 0) ||
          (state.axisY === 0 && lastState.axisY !== 0)
        ) {
          lastState = state;
          if (app.ports && app.ports.onDpad) {
            app.ports.onDpad.send(state);
          }
        }
      }

      function curveAxis(v, deadzone) {
        var mag = Math.abs(v);
        if (mag <= deadzone) return 0;
        var norm = Math.min(1, (mag - deadzone) / (1 - deadzone));
        // Smooth gradual ramp: fine control near center, full speed near edge
        var curved = Math.pow(norm, 1.35);
        return v < 0 ? -curved : curved;
      }

      function computeDpad(padEl, clientX, clientY) {
        var rect = padEl.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var radius = rect.width * 0.44;
        var nx = (clientX - cx) / radius;
        var ny = (clientY - cy) / radius;
        var dist = Math.hypot(nx, ny);
        if (dist > 1) {
          nx /= dist;
          ny /= dist;
        }
        return {
          axisX: curveAxis(nx, 0.12),
          axisY: curveAxis(ny, 0.14)
        };
      }

      function releaseDpad() {
        activeTouchId = null;
        mouseDown = false;
        sendDpad({ axisX: 0, axisY: 0 });
      }

      function getPad() {
        return document.getElementById("dpad-pad");
      }

      document.addEventListener("touchstart", function (e) {
        var pad = getPad();
        if (!pad) return;
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (pad.contains(t.target)) {
            e.preventDefault();
            activeTouchId = t.identifier;
            sendDpad(computeDpad(pad, t.clientX, t.clientY));
            return;
          }
        }
      }, { passive: false });

      document.addEventListener("touchmove", function (e) {
        if (activeTouchId === null) return;
        var pad = getPad();
        if (!pad) return;
        for (var i = 0; i < e.touches.length; i++) {
          var t = e.touches[i];
          if (t.identifier === activeTouchId) {
            e.preventDefault();
            sendDpad(computeDpad(pad, t.clientX, t.clientY));
            return;
          }
        }
      }, { passive: false });

      function onTouchEnd(e) {
        if (activeTouchId === null) return;
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeTouchId) {
            releaseDpad();
            return;
          }
        }
      }

      document.addEventListener("touchend", onTouchEnd, { passive: true });
      document.addEventListener("touchcancel", onTouchEnd, { passive: true });

      document.addEventListener("mousedown", function (e) {
        var pad = getPad();
        if (!pad || !pad.contains(e.target)) return;
        e.preventDefault();
        mouseDown = true;
        sendDpad(computeDpad(pad, e.clientX, e.clientY));
      });

      window.addEventListener("mousemove", function (e) {
        if (!mouseDown) return;
        var pad = getPad();
        if (!pad) return;
        sendDpad(computeDpad(pad, e.clientX, e.clientY));
      });

      window.addEventListener("mouseup", function () {
        if (mouseDown) releaseDpad();
      });

      window.addEventListener("blur", releaseDpad);
    })();
  </script>
</body>
</html>
