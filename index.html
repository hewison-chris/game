<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuckie Lift — Retro Elm Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #07080f;
      color: #f1f5f9;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #elm-root {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    svg {
      width: 100%;
      height: auto;
      max-height: 92vh;
      border: 3px solid #2dd4bf;
      border-radius: 6px;
      box-shadow: 0 0 32px rgba(45, 212, 191, 0.22);
      background: #0b0d17;
    }
  </style>
</head>
<body>
  <div id="elm-root"></div>
  <script src="main.js"></script>
  <script>
    window.addEventListener("keydown", function (e) {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);
    Elm.Main.init({
      node: document.getElementById("elm-root")
    });
  </script>
</body>
</html>
